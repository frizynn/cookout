# The example handler on Fly.io: one machine in lhr, which the deployed cookout calls at
# https://cookout-handler-example.fly.dev/webhook. Its secret COOKOUT_COMMAND_SECRET is the
# command's HMAC secret, set with `fly secrets import`. Deploy from the repo root, as the image
# needs the SDK's source:
#   fly deploy . -c packages/handler-example/fly.toml --dockerfile packages/handler-example/Dockerfile --ha=false
# Recipes: docs/verification.md ("Deploy the example handler to Fly").

app = "cookout-handler-example"
primary_region = "lhr"

[env]
  PORT = "8787"
  HOST = "::"
  COOKOUT_URL = "https://cookout.fly.dev"

# No auto-stop: the handler posts its result reply after answering 202, and it drops a repeated
# callId only while it remembers it, so it stays one machine, always running.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
