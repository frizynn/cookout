name: Check

# Check runs once per commit, on v1 and the merge-ticket-* branches only (#605): a worker runs
# `pnpm check` before opening a pull request. It doesn't run on pull_request or on ticket-* pushes,
# which ran it twice per commit and queued the landing runs behind them. A push to main doesn't run
# it: main is only fast-forwarded to a commit v1's push run already checked. A Check run has 5 jobs,
# the static checks and the unit tests on the merged result: `static`, `tests` ×3 and `coverage`.
# The browser tests, pack smoke, the published client and the e2e suite run in the Release
# workflow, the gate, on the newest v1 commit whose Check run is green, before it publishes and
# deploys (#636, docs/adr/0114-release-is-the-gate-on-the-newest-green-v1-commit.md).
on:
  push:
    branches: [v1, "merge-ticket-*"]
  workflow_dispatch:

permissions:
  contents: read

# Each v1 push run gets a group of its own, so a newer push neither cancels it nor replaces it in
# the queue. Other refs share one group per ref, where a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/v1' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v1' }}

jobs:
  # The 8 static checks, one step each, one after another on one runner: the job stops at the first
  # that fails, and its failed step names it. Each step runs the check's own `pnpm check --job=`.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # lint needs the base ref's baseline; drift's hygiene needs origin/v1, each ADR's first commit
          # and the deploy/* tags, to compare the migrations list with production's.
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          cache-name: static
      # lint's baseline ratchet and drift's lint-config guard both judge the push's range.
      - name: Pick the lint baseline's base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=HEAD^; fi
          echo "BASE=$BEFORE" >> "$GITHUB_ENV"
      - name: pnpm check --job=lint
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=lint --base="$BASE" --all --ci
      - name: pnpm check --job=canaries
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=canaries --all --ci
      - name: pnpm check --job=types
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=types --all --ci
      - name: pnpm check --job=fixers
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=fixers --all --ci
      - name: pnpm check --job=seams
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=seams --all --ci
      - name: pnpm check --job=knip
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=knip --all --ci
      - name: pnpm check --job=format
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=format --all --ci
      - name: pnpm check --job=drift
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=drift --base="$BASE" --all --ci

  # Two shards ran 4-5 minutes each and one was cancelled at the 5-minute limit after 284.7s of
  # passing tests (#485), so Vitest's --shard splits the test files across 3 jobs. Each uploads its
  # blob report, and the coverage job merges every vitest-blob-* into one run.
  tests:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/3 --all --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-${{ matrix.shard }}
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --all --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-merged
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore
