name: Check

on:
  pull_request:
  push:
    branches: [main, v1, rewrite-perfect-ts, "ticket-*", "merge-ticket-*"]

permissions:
  contents: read

# Each v1 push run gets a group of its own, so a newer push neither cancels it nor replaces it in
# the queue. Other refs share one group per ref, where a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/v1' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v1' }}

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # A runner has 2 cores, and lint, canaries and fixers ran about 1.7 times slower when two of
        # them shared one, so each gets its own job (ADR 0024).
        job: [lint, canaries, types, fixers, seams, knip, format, drift, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          # lint needs the base ref's baseline; drift's hygiene needs origin/v1, each ADR's first commit
          # and the deploy/* tags, to compare the migrations list with production's.
          fetch-depth: ${{ (matrix.job == 'lint' || matrix.job == 'drift') && '0' || '1' }}
          fetch-tags: ${{ matrix.job == 'drift' }}
      - uses: ./.github/actions/setup
        with:
          cache-name: ${{ matrix.job }}
      - name: Install headless Chromium
        if: matrix.job == 'browser'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: pnpm check --job=${{ matrix.job }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD^; fi
          node scripts/check.ts --job=${{ matrix.job }} --base="$BASE" --ci
      - name: Upload the per-file test timings
        if: always() && matrix.job == 'browser'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-browser
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  tests:
    name: tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/2 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-${{ matrix.shard }}
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  # The image and the example handler in Docker, driven by packages/e2e, as Deploy runs it before
  # deploying main, so a ticket or v1 push that breaks it fails here instead of blocking a deploy.
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e-docker
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e:docker
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-e2e-docker
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  pack:
    name: pack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: pack
      - run: pnpm run --silent pack:smoke

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-merged
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore
