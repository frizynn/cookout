name: Check

# Check runs once per commit (#483). A pull request from a branch in this repo already has its push
# run, so each job skips on its pull_request run (no runner is taken; the tools read push and
# merge_group runs only), while a fork's pull request still runs Check. A push to main doesn't run
# it: main is only fast-forwarded to a commit v1's push run already checked.
#
# v1 moves only by fast-forward (#567, docs/adr/…-v1-moves-only-by-fast-forward-from-a-green-merge-ticket-branch.md): pnpm merge-ticket
# pushes v1 to a merge-ticket-N commit whose push run is green. The merge_group trigger and the
# checked job are left from #522's merge queue, which GitHub doesn't offer on a user-owned repository,
# so no merge_group run happens here.
on:
  pull_request:
  merge_group:
  push:
    branches: [v1, rewrite-perfect-ts, "ticket-*", "merge-ticket-*"]

permissions:
  contents: read

# Each v1 push run gets a group of its own, so a newer push neither cancels it nor replaces it in
# the queue. Other refs share one group per ref, where a newer push cancels the older run. Each merge
# queue entry has its own gh-readonly-queue/v1/... ref, so its run gets a group of its own too.
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/v1' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v1' }}

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # A runner has 2 cores, and most of a type-aware Oxlint run is starting Node and loading its
        # plugins, so lint, canaries and fixers ran about 1.7 times slower when two of them shared one.
        # Each gets its own job, as does any new type-aware check.
        job: [lint, canaries, types, fixers, seams, knip, format, drift]
    steps:
      - uses: actions/checkout@v4
        with:
          # lint needs the base ref's baseline; drift's hygiene needs origin/v1, each ADR's first commit
          # and the deploy/* tags, to compare the migrations list with production's.
          fetch-depth: ${{ (matrix.job == 'lint' || matrix.job == 'drift') && '0' || '1' }}
          fetch-tags: ${{ matrix.job == 'drift' }}
      - uses: ./.github/actions/setup
        with:
          cache-name: ${{ matrix.job }}
      - name: pnpm check --job=${{ matrix.job }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD^; fi
          node scripts/check.ts --job=${{ matrix.job }} --base="$BASE" --ci

  # Every browser test in one job took 205s of a passing run and was cancelled at the 5-minute
  # limit on loaded runners (#455), so Playwright's --shard splits them, test by test, across 3
  # jobs: about 70s of tests each at 115 tests. Each shard uploads its JSON report, whose
  # stats.expected sum is the run's browser test count.
  browser:
    name: browser ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: browser
      # No --with-deps: ubuntu-latest already has every library the headless shell needs, and
      # --with-deps ran apt-get update and fetched 22 MB of fonts from the Ubuntu mirror, which
      # sometimes crawled at ~100 kB/s and took 4.5 minutes (#265).
      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium
      - name: pnpm check --job=browser --shard=${{ matrix.shard }}/3
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=browser --shard=${{ matrix.shard }}/3 --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-browser-${{ matrix.shard }}
          path: |
            .timings/*.txt
            .timings/browser.json
          include-hidden-files: true
          if-no-files-found: ignore
      # A local pnpm check fetches the newest of these on its base to pick the browser tests a branch reaches (#444).
      - name: Upload the browser coverage map
        uses: actions/upload-artifact@v4
        with:
          name: browser-coverage-map-${{ matrix.shard }}
          path: .browser-coverage/map.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # Every screen in scripts/lib/screens.ts, in both themes, against a real seeded board, so a UI
  # change that breaks a screen's steps fails here (#467 broke inbox-row-menu unnoticed). It only
  # checks each screen can be captured; it never compares images. The script exits non-zero when
  # any screen fails, naming each one.
  screenshots:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: screenshots
      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium
      - name: pnpm screenshots
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/screenshots.ts --out "$RUNNER_TEMP/screenshots"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # Two shards ran 4-5 minutes each and one was cancelled at the 5-minute limit after 284.7s of
  # passing tests (#485), so Vitest's --shard splits the test files across 3 jobs. Each uploads its
  # blob report, and the coverage job merges every vitest-blob-* into one run.
  tests:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/3 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-${{ matrix.shard }}
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  # The image and the example handler in Docker, driven by packages/e2e, as Deploy runs it before
  # deploying main, so a ticket or v1 push that breaks it fails here instead of blocking a deploy.
  e2e-docker:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e-docker
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:docker
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-e2e-docker
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  pack:
    name: pack smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: pack
      - run: pnpm run --silent pack:smoke

  # The newest @ai-hero/cookout on npm drives a dev cookout from this commit, so removing a response
  # field that the published client still requires fails here (docs/verification.md).
  published-client:
    name: published client
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: published-client
      - run: pnpm run --silent published-client

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-merged
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check a merge queue would require (docs/adr/…-v1-lands-through-github-s-merge-queue.md), so a ruleset needn't list every job and
  # shard by name and change whenever one is added. It fails if any other job failed or was
  # cancelled; a job skipped on a pull_request run from this repo passes, as that run checks nothing.
  checked:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 1
    needs: [check, browser, screenshots, tests, e2e-docker, pack, published-client, coverage]
    steps:
      - name: Every other job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then echo "Not every job passed:"; echo "$failed"; exit 1; fi
          echo "Every job passed."
