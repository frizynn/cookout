name: Check

on:
  pull_request:
  push:
    branches: [main, v1, rewrite-perfect-ts, "ticket-*"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        job: [lint, types, seams, knip, format, drift]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.job == 'lint' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          cache-name: ${{ matrix.job }}
      - name: pnpm check --job=${{ matrix.job }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD^; fi
          node scripts/check.ts --job=${{ matrix.job }} --base="$BASE" --ci

  tests:
    name: tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/2 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  pack:
    name: pack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: pack
      - run: pnpm run --silent pack:smoke

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --ci
