name: Release

# Opens or updates the "Version Packages" pull request from the changesets on main. Publishing to
# npm is off until Matt's OK (docs/adr/0031-changesets-version-the-package-and-publishing-stays-off.md).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-name: release
      - name: Open or update the Version Packages pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Off until Matt's OK (ADR 0031). Switching it on is one deliberate change: remove this
      # `if: false` guard, add the NPM_TOKEN secret as NODE_AUTH_TOKEN, and grant `id-token: write`.
      - name: Publish to npm
        if: false && steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
