# Deploy the cookout to Fly (app `cookout`, lhr) on every push to main, after `pnpm e2e:docker`
# passes, then check the deployed stream. A workflow_dispatch on any branch runs the same e2e and
# the deployed checks, without deploying; `restart: true` also restarts the machine first.
# Recipes: docs/verification.md ("Deploy it to Fly").
name: Deploy

on:
  push:
    branches: [main, ticket-64]
  workflow_dispatch:
    inputs:
      restart:
        description: Restart the Fly machine, then check the board outlived it
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e-docker
      - run: pnpm e2e:docker

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: e2e-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -a cookout --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deployed:
    needs: [e2e-docker, deploy]
    if: ${{ !cancelled() && needs.e2e-docker.result == 'success' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOKOUT_URL: https://cookout.fly.dev
      COOKOUT_TOKEN: ${{ secrets.COOKOUT_E2E_ADMIN_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: The secrets are set
        run: |
          for name in COOKOUT_TOKEN FLY_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: set its GitHub secret (docs/verification.md, \"Deploy it to Fly\")"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: deployed
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restart the machine
        if: ${{ inputs.restart || github.ref == 'refs/heads/ticket-64' }}
        run: |
          flyctl machine restart -a cookout "$(flyctl machines list -a cookout --json | jq -r '.[0].id')"
          for _ in $(seq 30); do curl -fsS "$COOKOUT_URL/v1/health" && break; sleep 2; done
      - name: identity list
        run: node app/main.ts identity list | jq -c '[.identities[].name]'
      - name: The stream stays open for 65 s and hears heartbeats
        run: scripts/stream-check.sh 65
